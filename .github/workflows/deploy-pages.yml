name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/personal-organizer-app-map-y8rrdh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # @supabase/* packages require >=22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # optional: only needed for the cloud backup/sync feature (مساحتي
          # -> الحساب والمزامنة). Add these as repo secrets (Settings ->
          # Secrets and variables -> Actions) to enable it; leave them unset
          # and the app builds and runs fine without that feature. Vite
          # bakes VITE_-prefixed vars into the build, so they must be set
          # here, not just in a local .env file.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
        with:
          # attempts to auto-create the Pages site; the default
          # GITHUB_TOKEN usually lacks the admin permission this needs,
          # so the repo owner still has to enable it once manually via
          # Settings -> Pages -> Source: GitHub Actions (see README)
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
